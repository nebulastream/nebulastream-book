name: Render and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout book
        uses: actions/checkout@v4

      - name: Checkout NebulaStream (drift-check target)
        uses: actions/checkout@v4
        with:
          repository: nebulastream/nebulastream
          ref: main
          path: vendor/nebulastream
          fetch-depth: 1

      - name: Run drift-check
        run: |
          python3 scripts/drift-check.py \
            --tree vendor/nebulastream \
            --ref HEAD \
            --strict
        env:
          NES_TREE: vendor/nebulastream
          NES_REF: HEAD

      - name: Set up TeX Live (for TikZ → SVG rebuild check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-pictures \
            texlive-latex-extra \
            dvisvgm
        if: github.event_name == 'pull_request'

      - name: Verify TikZ figures rebuild cleanly
        if: github.event_name == 'pull_request'
        run: |
          cd figures/tikz
          ./build.sh

  render:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Render book to HTML
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
